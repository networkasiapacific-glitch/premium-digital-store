<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Digital Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0c1524;
            --card-bg: #141132;
            --accent-color: #00d2c4;
            --text-main: #ffffff;
            --text-muted: #79869a;
            --alert-bg: rgba(239, 83, 80, 0.95);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 140px; display: flex; flex-direction: column; align-items: center; user-select: none; }
        .header { width: 100%; max-width: 500px; padding: 25px 20px 15px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 1.6rem; font-weight: bold; }
        .header p { margin: 8px 0 0 0; font-size: 0.85rem; color: #00b4a8; font-weight: bold; text-transform: uppercase; }
        .store-container { width: 100%; max-width: 500px; padding: 15px; padding-bottom: 140px; }
        .product-card { background-color: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; border: 2px solid transparent; }
        .product-card.active-border { border: 2px solid var(--accent-color); }
        .product-info { display: flex; align-items: center; gap: 16px; flex: 1; }
        .product-img { width: 75px; height: 75px; background-color: #1a273d; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: var(--text-muted); text-align: center; }
        .product-details h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
        .product-details p { margin: 4px 0 0 0; color: var(--accent-color); font-weight: bold; font-size: 0.95rem; }
        .quantity-control { display: flex; align-items: center; background-color: #1c2a42; border-radius: 8px; padding: 4px; border: 1px solid #283b5c; }
        .quantity-control button { background-color: #2775ff; color: white; border: none; width: 32px; height: 32px; border-radius: 6px; font-size: 1.3rem; font-weight: bold; cursor: pointer; }
        .quantity-control span { width: 36px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .footer-payment { position: fixed; bottom: 0; width: 100%; max-width: 500px; background-color: var(--bg-color); padding: 15px 20px; border-top: 1px solid #1c2a42; text-align: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); }
        .summary-text { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 14px; }
        .summary-text strong { color: var(--accent-color); }
        .pay-btn { width: 100%; background-color: var(--accent-color); color: #0c1524; border: none; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .pay-btn:disabled { background-color: #1c2a42; color: var(--text-muted); cursor: not-allowed; }
        .system-notice { font-size: 0.75rem; color: #e2b007; margin-top: 10px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Premium Digital Store</h1>
        <p>INSTANT ACCESS VIA SECURE CHECKOUT</p>
    </div>

    <div class="store-container" id="store-list"></div>

    <div class="footer-payment">
        <div class="summary-text">
            <span>Items Selected: <strong id="total-items">0 items</strong></span>
            <span>Net Total: <strong id="net-total">SGD 0.00</strong></span>
        </div>
        <button class="pay-btn" id="payButton" disabled onclick="proceedToPayment()">PROCEED TO PAYMENT (<span id="btn-count">0</span>)</button>
        <div class="system-notice">All operations are handled completely via real-time automatic systems.</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let products = [
            { id: "p1", name: "TikTok Automation Strategy", price: 5.00, isActive: true, count: 0 },
            { id: "p2", name: "Digital Marketing 2027", price: 5.00, isActive: true, count: 0 },
            { id: "p3", name: "E-Commerce Success Keys", price: 5.00, isActive: true, count: 0 },
            { id: "p4", name: "Advanced Automation Hub", price: 5.00, isActive: true, count: 0 },
            { id: "p5", name: "Financial Freedom Roadmap", price: 5.00, isActive: true, count: 0 },
            { id: "p6", name: "AI Content Formula", price: 5.00, isActive: true, count: 0 },
            { id: "p7", name: "Mastery Telegram", price: 5.00, isActive: true, count: 0 },
            { id: "p8", name: "Premium Strategy Guide", price: 5.00, isActive: true, count: 0 },
            { id: "p9", name: "Seni Jualan Senyap", price: 5.00, isActive: true, count: 0 },
            { id: "p10", name: "High Conversion Copywriting", price: 5.00, isActive: true, count: 0 },
            { id: "p11", name: "Organic Branding Matrix", price: 5.00, isActive: true, count: 0 },
            { id: "p12", name: "Viral Traffic System", price: 5.00, isActive: true, count: 0 },
            { id: "p13", name: "30-Day Video Action Plan", price: 5.00, isActive: true, count: 0 }
        ];

        function renderStore() {
            const container = document.getElementById('store-list');
            container.innerHTML = '';
            products.forEach((p, index) => {
                const card = document.createElement('div');
                // Menggunakan simbol backtick rasmi JavaScript untuk pembinaan kelas dinamik
                card.className = `product-card ${p.count > 0 ? 'active-border' : ''}`;
                card.innerHTML = `
                    <div class="product-info">
                        <div class="product-img">Active<br>Available</div>
                        <div class="product-details">
                            <h3>${p.name}</h3>
                            <p>SGD ${p.price.toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="quantity-control">
                        <button onclick="updateQty(${index}, -1)">-</button>
                        <span id="qty-${p.id}">${p.count}</span>
                        <button onclick="updateQty(${index}, 1)">+</button>
                    </div>
                `;
                container.appendChild(card);
            });
            updateTotals();
        }

        function updateQty(index, change) {
            products[index].count = Math.max(0, products[index].count + change);
            document.getElementById(`qty-${products[index].id}`).innerText = products[index].count;
            
            // Mengemas kini sempadan aktif jika kuantiti melebihi 0
            const cards = document.getElementsByClassName('product-card');
            if(products[index].count > 0) {
                cards[index].classList.add('active-border');
            } else {
                cards[index].classList.remove('active-border');
            }
            updateTotals();
        }

        function updateTotals() {
            let totalItems = 0, netTotal = 0;
            products.forEach(p => {
                totalItems += p.count;
                netTotal += (p.count * p.price);
            });
            document.getElementById('total-items').innerText = `${totalItems} items`;
            document.getElementById('net-total').innerText = `SGD ${netTotal.toFixed(2)}`;
            document.getElementById('btn-count').innerText = totalItems;
            
            const btn = document.getElementById('payButton');
            btn.disabled = totalItems === 0;
        }

        function proceedToPayment() {
            const selectedItems = products.filter(p => p.count > 0).map(p => ({
                id: p.id,
                qty: p.count
            }));
            
            const orderPayload = {
                currency: "SGD",
                items: selectedItems
            };
            
            // Hantar data troli yang lengkap ke pelayan Telegram Bot
            tg.sendData(JSON.stringify(orderPayload));
            tg.close();
        }

        renderStore();
    </script>
</body>
</html>
