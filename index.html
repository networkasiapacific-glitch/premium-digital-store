<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Digital Store</title>
    <script src="https://telegram.org"></script>
    <style>
        :root { --bg-color: #0b1426; --card-bg: #152238; --text-color: #ffffff; --accent-color: #0088cc; --danger-color: #e53935; --success-color: #4caf50; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; padding-bottom: 90px; user-select: none; -webkit-user-select: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .header h1 { margin: 0; font-size: 16px; font-weight: bold; color: #ffffff; }
        .admin-trigger { background: transparent; border: none; color: rgba(255,255,255,0.2); font-size: 11px; cursor: pointer; }
        .currency-box { background: var(--card-bg); padding: 12px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .currency-label { font-size: 13px; color: #8fa0bc; font-weight: 500; }
        .currency-select { background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; outline: none; cursor: pointer; }
        .section-title { font-size: 12px; text-transform: uppercase; color: #8fa0bc; letter-spacing: 1px; margin-bottom: 10px; font-weight: bold; }
        .product-list { display: flex; flex-direction: column; gap: 12px; }
        .product-card { background-color: var(--card-bg); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .product-info { flex: 1; margin-right: 10px; }
        .product-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; display: block; }
        .product-price { color: #0088cc; font-size: 13px; font-weight: bold; margin-bottom: 6px; display: block; }
        .badge-status { display: inline-block; background: rgba(76, 175, 80, 0.15); color: #4caf50; font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
        .qty-controls { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 20px; align-self: flex-end; }
        .btn-qty { background: var(--accent-color); border: none; color: white; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .qty-val { font-weight: bold; min-width: 15px; text-align: center; font-size: 14px; }
        .admin-actions { display: none; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
        body.admin-mode .admin-actions { display: flex; }
        body.admin-mode .qty-controls { display: none; }
        .btn-admin { border: none; color: white; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-edit { background-color: #ffa000; }
        .btn-delete { background-color: var(--danger-color); }
        .btn-save-item { background-color: var(--success-color); }
        .admin-top-controls { display: none; gap: 10px; margin-bottom: 15px; width: 100%; }
        body.admin-mode .admin-top-controls { display: flex; }
        .admin-top-controls .btn-add-list { margin-bottom: 0 !important; flex: 1; display: block !important; }
        .btn-add-list { padding: 12px; border-radius: 10px; border: none; color: white; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center; text-transform: uppercase; }
        .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0f1c32; padding: 15px; display: flex; justify-content: center; align-items: center; z-index: 100; border-top: 1px solid rgba(255,255,255,0.08); }
        .btn-main { background: var(--accent-color); color: white; border: none; width: 100%; max-width: 400px; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; text-transform: uppercase; }
        .btn-main:disabled { background: #2c3a52; color: #62728d; cursor: not-allowed; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); border-radius: 16px; padding: 20px; width: 100%; max-width: 340px; border: 1px solid rgba(255,255,255,0.1); }
        .modal-title { font-weight: bold; font-size: 15px; margin-bottom: 15px; text-align: center; }
        .btn-gate { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border-radius: 8px; border: none; color: white; font-weight: bold; margin-bottom: 10px; cursor: pointer; font-size: 14px; }
        .modal-close { text-align: center; color: #8fa0bc; font-size: 12px; cursor: pointer; margin-top: 10px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #8fa0bc; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Premium Digital Store</h1>
        <button class="admin-trigger" onclick="checkAdmin()">* Staff</button>
    </div>

    <div class="currency-box">
        <span class="currency-label">Select Currency:</span>
        <select class="currency-select" id="currencySelect" onchange="updateCurrency()">
            <option value="SGD">Singapore Dollar (SGD)</option>
            <option value="MYR">Malaysian Ringgit (MYR)</option>
        </select>
    </div>

    <div class="section-title">E-Book Catalogue</div>
    <div id="gatewayAdminBox"></div>

    <div class="admin-top-controls">
        <button class="btn-add-list" style="background-color: #0088cc;" onclick="openAddModal()">⚡ + Add New E-Book</button>
        <button class="btn-add-list" style="background-color: #4caf50;" onclick="openAddGatewayModal()">💳 + Add Payment Method</button>
    </div>

    <div class="product-list" id="productList"></div>

    <div class="footer-bar">
        <button class="btn-main" id="payButton" onclick="openPaymentModal()" disabled>PROCEED TO PAYMENT</button>
    </div>

    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <div class="modal-title">SELECT PAYMENT METHOD</div>
            <div id="paymentGatewayList" style="display: flex; flex-direction: column; gap: 10px; width: 100%;"></div>
            <div class="modal-close" onclick="closeModal('paymentModal')">[ Cancel ]</div>
        </div>
    </div>

    <div class="modal" id="editorModal">
        <div class="modal-content">
            <div class="modal-title" id="editorTitle">Edit Item</div>
            <input type="hidden" id="editType">
            <input type="hidden" id="editIndex">
            
            <div class="form-group">
                <label id="labelName">Name / Title</label>
                <input type="text" id="itemName">
            </div>
            
            <div class="form-group" id="priceGroup">
                <label>Base Price (SGD)</label>
                <input type="number" step="0.01" id="itemPrice">
            </div>
            
            <div class="form-group" id="linkGroup">
                <label id="labelLink">Destination Link</label>
                <input type="text" id="itemLink">
            </div>

            <!-- Fix: Shared upload structure for Add New Book and Yellow Set Link Button -->
            <div class="form-group" id="productAssetUploadGroup" style="display: none;">
                <label>Upload Digital Asset (PDF, MP3, MP4, or Image)</label>
                <input type="file" id="itemAssetFile" accept=".pdf,.mp3,.mp4,image/*" onchange="handleAssetUpload(this)">
            </div>
            
            <div class="form-group" id="qrUploadGroup" style="display: none;">
                <label>Upload QR Scan Picture</label>
                <input type="file" id="itemQrFile" accept="image/*" onchange="handleQrUpload(this)">
            </div>
            
            <button class="btn-main" style="background-color: #4caf50;" onclick="saveItemChanges()">Save Changes</button>
            <div class="modal-close" onclick="closeModal('editorModal')">[ Close ]</div>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        if(tg && typeof tg.expand === 'function') tg.expand();
        let currentCurrency = "SGD";
        const EXCHANGE_RATE = 3.30;
        let base64QrImage = ""; 
        let base64AssetFile = ""; 

        let defaultProducts = [
            { id: 1, name: "TikTok Automation Strategy", price: 25.00, qty: 0, link: "" },
            { id: 2, name: "Digital Marketing 2027", price: 25.00, qty: 0, link: "" },
            { id: 3, name: "E-Commerce Success Keys", price: 5.00, qty: 0, link: "" }
        ];

        let defaultGateways = [
            { id: "tng", name: "Touch 'n Go eWallet", link: "161390792973", color: "#005bc4" },
            { id: "stripe", name: "Credit Card / FPX (Stripe)", link: "https://stripe.com", color: "#635bff" }
        ];

        let products = JSON.parse(localStorage.getItem('premium_store_products')) || defaultProducts;
        let gateways = JSON.parse(localStorage.getItem('premium_store_gateways')) || defaultGateways;
        products.forEach(p => p.qty = 0);

        function renderProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = '';

            if(document.body.classList.contains('admin-mode')) {
                let gatewayAdminHTML = '<div id="gatewayAdminBox" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05);">' +
                    '<span style="font-size:12px; color: #ffc107; font-weight:bold; display:block; margin-bottom:8px;">⚙️ PAYMENT METHOD MANAGEMENT (PERMANENT)</span>' +
                    '<div id="adminGatewayList" style="display: flex; flex-direction:column; gap: 6px;"></div>' +
                    '</div>';
                
                const titleSec = document.querySelector('.section-title');
                if(titleSec && !document.getElementById('gatewayAdminBox')) {
                    const divWrapper = document.createElement('div');
                    divWrapper.innerHTML = gatewayAdminHTML;
                    titleSec.parentNode.insertBefore(divWrapper.firstChild, titleSec);
                }
                renderAdminGateways();
            } else {
                const box = document.getElementById('gatewayAdminBox');
                if(box) box.remove();
            }

            products.forEach((p, index) => {
                const displayPrice = currentCurrency === "SGD" ? p.price : (p.price * EXCHANGE_RATE);
                const card = document.createElement('div');
                card.className = 'product-card';
                
                card.innerHTML = '<div class="product-info">' +
                    '<span class="product-name">' + p.name + '</span>' +
                    '<span class="product-price">' + currentCurrency + ' ' + displayPrice.toFixed(2) + '</span>' +
                    '<span class="badge-status">Available</span>' +
                    '</div>' +
                    '<div class="qty-controls">' +
                    '<button class="btn-qty" onclick="changeQty(' + index + ', -1)">-</button>' +
                    '<span class="qty-val">' + p.qty + '</span>' +
                    '<button class="btn-qty" onclick="changeQty(' + index + ', 1)">+</button>' +
                    '</div>' +
                    '<div class="admin-actions">' +
                    '<button class="btn-admin btn-edit" onclick="openEditProductModal(' + index + ')">Edit</button>' +
                    '<button class="btn-admin btn-delete" onclick="deleteProduct(' + index + ')">Delete</button>' +
                    '<button class="btn-admin" style="background-color: #ffc107; color: #000; font-weight:bold;" onclick="openSetLinkModal(' + index + ')">Set Link</button>' +
                    '<button class="btn-admin btn-save-item" onclick="savePermanently()">Save</button>' +
                    '</div>';
                list.appendChild(card);
            });
            updateTotalPrice();
        }
        function renderAdminGateways() {
            const container = document.getElementById('adminGatewayList');
            if(!container) return;
            container.innerHTML = '';
            gateways.forEach((g, index) => {
                const div = document.createElement('div');
                div.style.display = 'flex';
                div.style.justify = 'space-between';
                div.style.alignItems = 'center';
                div.style.background = 'rgba(0,0,0,0.2)';
                div.style.padding = '8px';
                div.style.borderRadius = '8px';
                div.style.fontSize = '12px';
                div.style.marginBottom = '4px';
                
                div.innerHTML = '<span>' + g.name + '</span>' +
                    '<div style="display: flex; gap:4px;">' +
                    '<button class="btn-admin btn-edit" style="padding:4px 10px; font-size:10px;" onclick="openEditGatewayModal(' + index + ')">Edit</button>' +
                    '<button class="btn-admin btn-delete" style="padding:4px 10px; font-size:10px;" onclick="deleteGateway(' + index + ')">Delete</button>' +
                    '<button class="btn-admin" style="padding:4px 10px; font-size:10px; background-color:#4caf50;" onclick="savePermanently()">Save</button>' +
                    '</div>';
                container.appendChild(div);
            });
        }

        function openPaymentModal() {
            const container = document.getElementById('paymentGatewayList');
            container.innerHTML = '';
            const purchasedItems = products.filter(p => p.qty > 0);
            if(purchasedItems.length === 0) return;

            gateways.forEach(g => {
                const btn = document.createElement('button');
                btn.className = 'btn-gate';
                btn.style.width = '100%';
                btn.style.padding = '12px';
                btn.style.borderRadius = '8px';
                btn.style.border = 'none';
                btn.style.color = 'white';
                btn.style.fontWeight = 'bold';
                btn.style.marginBottom = '10px';
                btn.style.backgroundColor = g.color || '#0088cc';
                btn.innerText = g.name;

                btn.onclick = function() {
                    closeModal('paymentModal');
                    
                    // Alur Integrasi Bot: Status dihantar ke bot telegram sebagai AWAITING_PAYMENT_TRACE untuk dikesan kelulusan automatik
                    const orderData = { 
                        action: "PROCESS_AUTOMATIC_INVOICE",
                        status: "AWAITING_PAYMENT_TRACE",
                        gateway_name: g.name, 
                        currency: currentCurrency, 
                        gateway_details: g.link, 
                        items: purchasedItems.map(p => ({ id: p.id, name: p.name, qty: p.qty, secured_asset_data: p.link })) 
                    };
                    
                    try { 
                        if(tg && typeof tg.sendData === 'function') {
                            tg.sendData(JSON.stringify(orderData)); 
                        }
                    } catch(e){}

                    if (g.link.startsWith('http://') || g.link.startsWith('https://')) {
                        alert("Redirecting to the secure " + g.name + " checkout system. Once payment is authorized, your digital goods and transaction receipts will be automatically dispatched here via Telegram.");
                        window.open(g.link, '_blank');
                    } else if (g.link.startsWith('data:image')) {
                        alert("Please scan the generated payment QR code on your screen to complete the transaction. Our system will automatically monitor the transaction gateway, confirm the receipt, and send your purchased file directly to this chat window.");
                    } else {
                        alert("PAYMENT INVOICE GENERATED\n\nPlease transfer your payment to the following " + g.name + " account details:\nAccount Details: " + g.link + "\n\nUpon gateway confirmation, the system will instantly process your transaction receipt and automatically send your purchased digital file down to this chat channel.");
                    }
                };
                container.appendChild(btn);
            });
            document.getElementById('paymentModal').classList.add('active');
        }

        function openEditProductModal(index) {
            document.getElementById('editorTitle').innerText = "Edit E-Book Details";
            document.getElementById('editType').value = "product";
            document.getElementById('editIndex').value = index;
            document.getElementById('labelName').innerText = "Product Name / Title";
            document.getElementById('itemName').value = products[index].name;
            document.getElementById('itemPrice').value = products[index].price;
            document.getElementById('priceGroup').style.display = "block";
            document.getElementById('linkGroup').style.display = "none"; 
            document.getElementById('productAssetUploadGroup').style.display = "none";
            document.getElementById('qrUploadGroup').style.display = "none";
            document.getElementById('editorModal').classList.add('active');
        }
        function openSetLinkModal(index) {
            document.getElementById('editorTitle').innerText = "💛 Set Digital Asset (YELLOW BOX)";
            document.getElementById('editType').value = "product";
            document.getElementById('editIndex').value = index;
            document.getElementById('labelName').innerText = "Product Name (Read-Only)";
            document.getElementById('labelLink').innerText = "Paste Asset Destination Link (URL / Group Link)";
            document.getElementById('itemName').value = products[index].name;
            document.getElementById('itemLink').value = products[index].link && !products[index].link.startsWith("data:") ? products[index].link : "";
            document.getElementById('itemLink').placeholder = "Paste your download URL or group invite link here";
            
            document.getElementById('priceGroup').style.display = "none"; 
            document.getElementById('linkGroup').style.display = "block";
            document.getElementById('productAssetUploadGroup').style.display = "block"; 
            document.getElementById('qrUploadGroup').style.display = "none";
            
            base64AssetFile = products[index].link && products[index].link.startsWith("data:") ? products[index].link : "";
            document.getElementById('itemAssetFile').value = "";
            document.getElementById('editorModal').classList.add('active');
        }

        function openAddModal() {
            document.getElementById('editorTitle').innerText = "Add New E-Book";
            document.getElementById('editType').value = "product";
            document.getElementById('editIndex').value = "-1";
            document.getElementById('labelName').innerText = "Product Name / Title";
            document.getElementById('labelLink').innerText = "Destination Link (URL / Group Link)";
            document.getElementById('itemName').value = "";
            document.getElementById('itemPrice').value = "";
            document.getElementById('itemLink').value = "";
            document.getElementById('itemLink').placeholder = "Enter your download URL or group invite link here";
            
            document.getElementById('priceGroup').style.display = "block";
            document.getElementById('linkGroup').style.display = "block";
            document.getElementById('productAssetUploadGroup').style.display = "block"; 
            document.getElementById('qrUploadGroup').style.display = "none";
            
            base64AssetFile = "";
            document.getElementById('itemAssetFile').value = "";
            document.getElementById('editorModal').classList.add('active');
        }

        function openAddGatewayModal() {
            document.getElementById('editorTitle').innerText = "Add New Payment Method (GREEN BUTTON)";
            document.getElementById('editType').value = "gateway";
            document.getElementById('editIndex').value = "-1";
            document.getElementById('labelName').innerText = "Payment Method Name (e.g., TNG, Stripe)";
            document.getElementById('labelLink').innerText = "Payment URL / Account Number";
            document.getElementById('itemName').value = "";
            document.getElementById('itemLink').value = "";
            document.getElementById('itemLink').placeholder = "Enter your Stripe web link or wallet account number";
            document.getElementById('priceGroup').style.display = "none";
            document.getElementById('linkGroup').style.display = "block";
            document.getElementById('productAssetUploadGroup').style.display = "none";
            document.getElementById('qrUploadGroup').style.display = "block"; 
            base64QrImage = "";
            document.getElementById('itemQrFile').value = "";
            document.getElementById('editorModal').classList.add('active');
        }

        function openEditGatewayModal(index) {
            document.getElementById('editorTitle').innerText = "Edit Payment Method";
            document.getElementById('editType').value = "gateway";
            document.getElementById('editIndex').value = index;
            document.getElementById('labelName').innerText = "Payment Method Name";
            document.getElementById('labelLink').innerText = "Payment URL / Account Number";
            document.getElementById('itemName').value = gateways[index].name;
            document.getElementById('itemLink').value = gateways[index].link.startsWith("data:") ? "" : gateways[index].link;
            document.getElementById('priceGroup').style.display = "none";
            document.getElementById('linkGroup').style.display = "block";
            document.getElementById('productAssetUploadGroup').style.display = "none";
            document.getElementById('qrUploadGroup').style.display = "block";
            document.getElementById('itemQrFile').value = "";
            base64QrImage = gateways[index].link.startsWith("data:") ? gateways[index].link : "";
            document.getElementById('editorModal').classList.add('active');
        }

        function handleAssetUpload(input) {
            const files = input.files;
            if (files && files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64AssetFile = e.target.result; 
                };
                reader.readAsDataURL(files[0]);
            }
        }

        function handleQrUpload(input) {
            const files = input.files;
            if (files && files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64QrImage = e.target.result;
                };
                reader.readAsDataURL(files[0]);
            }
        }
        function saveItemChanges() {
            const index = parseInt(document.getElementById('editIndex').value);
            const name = document.getElementById('itemName').value;
            let link = document.getElementById('itemLink').value;
            const type = document.getElementById('editType').value;
            const titleText = document.getElementById('editorTitle').innerText;

            if ((titleText.includes("YELLOW BOX") || titleText.includes("Add New E-Book")) && base64AssetFile !== "") {
                link = base64AssetFile; 
            } else if(type === "gateway" && base64QrImage !== "") {
                link = base64QrImage;
            }

            if(!name) return alert("Please fill in the required name field correctly.");

            if(type === "product") {
                const price = parseFloat(document.getElementById('itemPrice').value) || 0;
                if(index === -1) {
                    if(isNaN(price) || price <= 0) return alert("Please enter a valid price for the new book.");
                    const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
                    products.push({ id: newId, name: name, price: price, link: link, qty: 0 });
                } else {
                    if(titleText.includes("YELLOW BOX")) {
                        products[index].link = link; 
                    } else {
                        products[index].name = name;
                        products[index].price = price;
                    }
                }
            } else if(type === "gateway") {
                if(!link) return alert("Please provide payment routing parameters or upload a clear QR scan image file.");
                if(index === -1) {
                    gateways.push({ id: "gate_" + Date.now(), name: name, link: link, color: "#152238" });
                } else {
                    gateways[index].name = name;
                    gateways[index].link = link;
                }
            }
            
            localStorage.setItem('premium_store_products', JSON.stringify(products));
            localStorage.setItem('premium_store_gateways', JSON.stringify(gateways));
            closeModal('editorModal');
            renderProducts();
            alert("💾 Saved changes successfully!");
        }

        function deleteProduct(index) {
            if(confirm("Are you sure you want to permanently delete the e-book: " + products[index].name + "?")) {
                products.splice(index, 1);
                savePermanently();
            }
        }

        function deleteGateway(index) {
            if(confirm("Are you sure you want to permanently delete the payment method: " + gateways[index].name + "?")) {
                gateways.splice(index, 1);
                localStorage.setItem('premium_store_gateways', JSON.stringify(gateways));
                renderProducts();
            }
        }

        function savePermanently() {
            localStorage.setItem('premium_store_products', JSON.stringify(products));
            localStorage.setItem('premium_store_gateways', JSON.stringify(gateways));
            try { if(tg && typeof tg.sendData === 'function') tg.sendData(JSON.stringify({ action: "sync_database", updated_list: products })); } catch(e){}
            document.body.classList.remove('admin-mode');
            alert("💾 Saved Permanently! All items and payment settings have been saved to local database storage.");
            renderProducts();
        }

        function changeQty(index, change) {
            products[index].qty = Math.max(0, products[index].qty + change);
            renderProducts();
        }

        function updateCurrency() {
            currentCurrency = document.getElementById('currencySelect').value;
            renderProducts();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function updateTotalPrice() {
            let total = 0;
            products.forEach(p => {
                const price = currentCurrency === "SGD" ? p.price : (p.price * EXCHANGE_RATE);
                total += price * p.qty;
            });
            const btn = document.getElementById('payButton');
            btn.innerText = 'PROCEED TO PAYMENT (' + currentCurrency + ' ' + total.toFixed(2) + ')';
            btn.disabled = total === 0 && !document.body.classList.contains('admin-mode');
        }

        function checkAdmin() {
            if(document.body.classList.contains('admin-mode')) {
                document.body.classList.remove('admin-mode');
                renderProducts();
                return;
            }
            const code = prompt("Enter Admin Security Code:");
            if(code === "333555") {
                document.body.classList.add('admin-mode');
                renderProducts();
            } else if (code !== null) {

        }

        window.onload = renderProducts;
