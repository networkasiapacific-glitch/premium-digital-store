const tg = window.Telegram.WebApp; tg.expand();
let selectedProducts = {}; const multiplier = 2.50;
const STRIPE_URL = "stripe.com";
function toggleSelect(id, price, name) {
const card = document.getElementById(id); const btn = document.getElementById('btn-' + id);
if (selectedProducts[id]) {
delete selectedProducts[id]; card.classList.remove('selected');
btn.innerHTML = '🛒 Select Item'; btn.style.backgroundColor = '#2481cc';
} else {
selectedProducts[id] = { price: price, name: name }; card.classList.add('selected');
btn.innerHTML = '❌ Remove'; btn.style.backgroundColor = '#d90429';
}
updateSummary();
}
function updateSummary() {
let itemCount = Object.keys(selectedProducts).length; let baseTotal = 0;
for (let key in selectedProducts) { baseTotal += selectedProducts[key].price; }
let finalTotal = baseTotal * multiplier;
document.getElementById('total-items').innerText = itemCount + (itemCount === 1 ? ' Item' : ' Items');
document.getElementById('total-price').innerText = 'SGD ' + finalTotal.toFixed(2);
const checkoutBtn = document.getElementById('main-checkout-btn');
if (itemCount > 0) { checkoutBtn.disabled = false; checkoutBtn.innerText = 'PROCEED TO PAYMENT (' + itemCount + ')'; }
else { checkoutBtn.disabled = true; checkoutBtn.innerText = 'PROCEED TO PAYMENT'; }
}
function redirectToStripe() {
let itemNames = []; let totalCost = 0;
for (let key in selectedProducts) { itemNames.push(selectedProducts[key].name); totalCost += selectedProducts[key].price; }
let finalNetPrice = totalCost * multiplier;
const orderData = { items: itemNames, multiplier: multiplier, total_sgd: finalNetPrice.toFixed(2), action: "REDIRECTED_TO_STRIPE" };
tg.sendData(JSON.stringify(orderData)); tg.openLink(STRIPE_URL); tg.close();
}
