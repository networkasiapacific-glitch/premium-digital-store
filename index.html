<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Digital Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #0b141a; --card-bg: #182229; --text-main: #ffffff; --text-sub: #8796a1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 150px; }
        .header-banner { background: linear-gradient(135deg, #1a3c72 0%, #2a5298 100%); padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .currency-panel { padding: 12px 5%; background: #111c24; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .currency-select { background-color: var(--card-bg); color: var(--text-main); border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; }
        .section-title { padding: 15px 5%; font-size: 0.85rem; text-transform: uppercase; color: var(--text-sub); font-weight: bold; }
        .product-list { display: flex; flex-direction: column; gap: 10px; padding: 0 5%; }
        .product-card { background-color: var(--card-bg); border-radius: 12px; padding: 15px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.05); }
        .product-details { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .product-title { font-size: 0.95rem; font-weight: bold; }
        .product-price { font-size: 0.85rem; color: #2488ff; font-weight: bold; }
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; width: fit-content; background-color: rgba(0, 191, 165, 0.2); color: #00bfa5; }
        .counter-group { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
        .btn-counter { background-color: #2488ff; color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .terms-banner { background-color: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); margin: 25px 5% 10px 5%; padding: 12px; border-radius: 8px; text-align: center; }
        .terms-text { font-size: 0.78rem; color: #fca5a5; line-height: 1.4; font-weight: 500; }
        .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: #17212b; padding: 15px 5%; border-top: 1px solid rgba(255,255,255,0.1); }
        .checkout-btn { background-color: #2488ff; color: white; border: none; padding: 14px 20px; width: 100%; border-radius: 10px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
        .checkout-btn:disabled { background-color: #23303d; color: var(--text-sub); cursor: not-allowed; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-content { background: #17212b; padding: 25px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .modal-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; }
        .btn-gate { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; margin-bottom: 12px; cursor: pointer; font-size: 0.95rem; color: white; }
        .btn-tng { background-color: #005bc4; }
        .btn-stripe { background-color: #635bff; }
        .btn-close { background-color: transparent; color: var(--text-sub); font-size: 0.9rem; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header-banner">
        <h2>Premium Digital Store</h2>
        <p style="font-size: 0.85rem; color: #cbd5e1; margin-top: 4px;">Instant Access Via Secure Checkout</p>
    </div>

    <div class="currency-panel">
        <span style="color: var(--text-sub); font-size: 0.9rem;">Select Currency:</span>
        <select id="currencySelector" class="currency-select" onchange="handleCurrencyChange()">
            <option value="SGD">Singapore Dollar (SGD)</option>
            <option value="RM">Malaysia Ringgit (RM)</option>
        </select>
    </div>

    <div class="section-title">E-Book Catalogue</div>
    <div id="storeProductList" class="product-list"></div>
    
    <div class="terms-banner">
        <p class="terms-text">⚠️ **Notice:** All digital purchases are final, deemed valid immediately upon purchase, and are strictly non-refundable under any circumstances whatsoever.</p>
    </div>

    <div class="footer-bar">
        <button class="checkout-btn" id="checkoutBtn" disabled onclick="openPaymentModal()">Proceed To Payment</button>
    </div>

    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">SELECT PAYMENT METHOD</div>
            <button class="btn-gate btn-tng" onclick="submitOrder('TNG')">📲 Touch 'n Go eWallet / DuitNow</button>
            <button class="btn-gate btn-stripe" onclick="submitOrder('STRIPE')">💳 Credit Card / FPX Bank (Stripe)</button>
            <button class="btn-gate btn-close" onclick="closePaymentModal()">[ Cancel ]</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let selectedCurrency = "SGD";
        const myrRate = 3.30; 

        let products = [
            { id: "p1", name: "TikTok Automation Strategy", price: 5.00, count: 0 },
            { id: "p2", name: "Digital Marketing 2027", price: 5.00, count: 0 },
            { id: "p3", name: "E-Commerce Success Keys", price: 5.00, count: 0 },
            { id: "p4", name: "Advanced Automation Hub", price: 5.00, count: 0 },
            { id: "p5", name: "Financial Freedom Roadmap", price: 5.00, count: 0 },
            { id: "p6", name: "AI Content Formula", price: 5.00, count: 0 },
            { id: "p7", name: "Mastery Telegram", price: 5.00, count: 0 },
            { id: "p8", name: "Premium Strategy Guide", price: 5.00, count: 0 },
            { id: "p9", name: "Seni Jualan Senyap", price: 5.00, count: 0 },
            { id: "p10", name: "High Conversion Copywriting", price: 5.00, count: 0 },
            { id: "p11", name: "Organic Branding Matrix", price: 5.00, count: 0 },
            { id: "p12", name: "Viral Traffic System", price: 5.00, count: 0 },
            { id: "p13", name: "30-Day Video Action Plan", price: 5.00, count: 0 }
        ];

        function renderStore() {
            const container = document.getElementById('storeProductList');
            container.innerHTML = '';
            products.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                const finalPrice = selectedCurrency === "SGD" ? p.price : (p.price * myrRate);
                const currencySign = selectedCurrency === "SGD" ? "SGD" : "RM";
                card.innerHTML = `
                    <div class="product-details">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${currencySign} ${finalPrice.toFixed(2)}</div>
                        <div class="badge">Available</div>
                    </div>
                    <div class="counter-group">
                        <button class="btn-counter" onclick="updateQty(${index}, -1)">-</button>
                        <span id="qty-${p.id}" style="font-weight: bold; min-width: 25px; text-align: center;">${p.count}</span>
                        <button class="btn-counter" onclick="updateQty(${index}, 1)">+</button>
                    </div>
                `;
                container.appendChild(card);
            });
            updateTotals();
        }

        function updateQty(index, change) {
            products[index].count = Math.max(0, products[index].count + change);
            renderStore();
        }

        function handleCurrencyChange() {
            selectedCurrency = document.getElementById('currencySelector').value;
            renderStore();
        }

        function updateTotals() {
            let totalItems = 0, totalPrice = 0;
            products.forEach(p => { totalItems += p.count; totalPrice += (p.count * p.price); });
            const btn = document.getElementById('checkoutBtn');
            const finalTotal = selectedCurrency === "SGD" ? totalPrice : (totalPrice * myrRate);
            const currencySign = selectedCurrency === "SGD" ? "SGD" : "RM";
            
            if (totalItems > 0) {
                btn.disabled = false;
                btn.innerText = `PROCEED TO PAYMENT (${currencySign} ${finalTotal.toFixed(2)})`;
            } else {
                btn.disabled = true;
                btn.innerText = "PROCEED TO PAYMENT";
            }
        }

        function openPaymentModal() { document.getElementById('paymentModal').style.display = 'flex'; }
        function closePaymentModal() { document.getElementById('paymentModal').style.display = 'none'; }

        function submitOrder(method) {
            const selectedItems = products.filter(p => p.count > 0).map(p => ({ id: p.id, qty: p.count }));
            const orderPayload = { currency: selectedCurrency, gateway: method, items: selectedItems };
            tg.sendData(JSON.stringify(orderPayload));
            tg.close();
        }

        renderStore();
    </script>
</body>
</html>
